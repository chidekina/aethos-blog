name: CI

# Vercel deploys from main on push, so the gate has to be the PULL REQUEST.
# A check that only ran on push would report after the deploy it was meant to
# guard. `on:` is load-bearing: a workflow with complete steps and no trigger
# runs never, and reads as a green gate that simply has nothing to say.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The build does NOT typecheck — Astro strips types. A type error can sit
      # in the tree indefinitely while every other step stays green, which is
      # exactly what happened: TS2345 in the OG route survived from the initial
      # commit until 2026-09-02. Fixing it without a gate only lets the next one
      # accumulate the same way.
      #
      # `astro check`, not bare `tsc`: tsc does not parse .astro files, and this
      # src/ is 6 .astro to 3 .ts. Measured — a forged type error in a .astro
      # file left `tsc --noEmit` reporting zero, which is the shape of a gate
      # that guards almost nothing while looking thorough.
      #
      # TypeScript is pinned to 6.x on purpose: 7.x is the native compiler and
      # does not expose the programmatic API astro check needs. Bumping it to 7
      # breaks this step until upstream lands support.
      - name: Typecheck (astro check — covers .astro and .ts)
        run: bun run check

      # The content schemas in src/content/config.ts are the only validation
      # layer for posts and recommendations, so a passing build IS the check
      # that every content file is well-formed.
      - name: Build (schema validation, OG images, RSS, sitemap)
        run: bun run build

      # These run the real scripts against fixtures, no network required.
      - name: News pipeline suite
        run: bash scripts/news/fetch-news.test.sh

      - name: Cron wrapper suite
        run: bash scripts/news/run-digest.test.sh

      # The eval-pair machinery (docs/DIGEST-EVAL.md items 1-2). Both suites are
      # pure: no network, no model, no clock.
      - name: Entity/number preservation suite
        run: bash scripts/news/check-entities.test.sh

      - name: Published-half capture suite
        run: bash scripts/news/capture-published.test.sh

      - name: Fallback excerpt trim suite
        run: bash scripts/news/excerpt.test.sh

      # A suite is a claim that the code is tested; a mutation run is the
      # evidence. Both harnesses restore the source and fail if it comes back
      # dirty, so a red step here means a mutation SURVIVED — an assertion that
      # is present and asserting nothing.
      - name: Mutation harnesses (each mutation must turn its suite red)
        run: |
          bash scripts/news/check-entities.mutate.sh
          bash scripts/news/capture-published.mutate.sh
          bash scripts/news/excerpt.mutate.sh

      - name: Recommendations suite
        run: bash scripts/recommendations/from-issue.test.sh

      # Two-ended: the site must be static (no adapter), and the drafts a
      # generated digest is born with must be visible in the output. A build
      # that silently published every draft would pass everything above.
      - name: Assert the built site is static
        run: |
          test ! -d .vercel/output/functions || {
            echo "::error::Server functions in the build output — the site is meant to be static (CONTRACT invariant 1)"
            exit 1
          }

      # Search is only as good as what reaches the index, and a narrowed index
      # fails SILENTLY: queries just stop matching. The body-text assertion below
      # is derived from the live posts rather than hardcoding a term, so it keeps
      # meaning as the corpus changes.
      - name: Assert the search index carries body text, not just metadata
        run: |
          python3 - <<'PY'
          import glob, json, os, re, sys

          idx_path = 'dist/search-index.json'
          if not os.path.exists(idx_path):
              print('::error::dist/search-index.json was not emitted'); sys.exit(1)
          rows = json.load(open(idx_path, encoding='utf-8'))
          by_slug = {r['slug']: r['text'] for r in rows}

          # Positive control: an empty index would satisfy every "absent" check below.
          if not rows:
              print('::error::search index is empty — the checks below would be vacuous'); sys.exit(1)

          published = {os.path.basename(os.path.dirname(f)) for f in glob.glob('dist/blog/*/index.html')}
          missing = sorted(published - set(by_slug))
          if missing:
              print(f'::error::published posts absent from the search index: {missing}'); sys.exit(1)

          # The load-bearing one. For each post, find a word that appears in its
          # BODY but not in its title/description/tags; that word must be indexed.
          # If the index ever narrows to metadata, every such word disappears.
          checked = 0
          for f in glob.glob('src/content/blog/*.mdx'):
              raw = open(f, encoding='utf-8').read()
              m = re.match(r'^---\n(.*?)\n---\n(.*)$', raw, re.S)
              if not m:
                  print(f'::error::{f} has no frontmatter'); sys.exit(1)
              fm, body = m.group(1), m.group(2)
              if re.search(r'^draft:\s*true\s*$', fm, re.M):
                  continue
              slug = os.path.basename(f)[:-4]
              if slug not in by_slug:
                  continue
              meta = fm.lower()
              prose = re.sub(r'```[\s\S]*?```', ' ', body).lower()
              cand = [w for w in re.findall(r'[a-z]{6,}', prose) if w not in meta]
              if not cand:
                  continue
              word = cand[0]
              if word not in by_slug[slug]:
                  print(f'::error::body word "{word}" from {slug} is not in the search index — '
                        f'the index looks metadata-only'); sys.exit(1)
              checked += 1

          if checked == 0:
              print('::error::no post yielded a body-only word — this check proved nothing'); sys.exit(1)

          # Negative control: a matcher that matched everything would pass all of the above.
          junk = 'zzzqxnotaword'
          if any(junk in text for text in by_slug.values()):
              print('::error::negative control matched — the index is not what it claims'); sys.exit(1)

          drafts = {os.path.basename(f)[:-4] for f in glob.glob('src/content/blog/*.mdx')
                    if re.search(r'^draft:\s*true\s*$', open(f, encoding='utf-8').read().split('---')[1], re.M)}
          leaked = sorted(drafts & set(by_slug))
          if leaked:
              print(f'::error::draft posts reached the search index: {leaked}'); sys.exit(1)

          print(f'ok: {len(rows)} posts indexed, body text verified on {checked}, '
                f'{len(drafts)} draft(s) excluded')
          PY

      - name: Assert drafts stay out of the published output
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          drafts = []
          for f in glob.glob('src/content/blog/*.mdx'):
              head = open(f, encoding='utf-8').read().split('---')[1]
              if re.search(r'^draft:\s*true\s*$', head, re.M):
                  drafts.append(os.path.basename(f)[:-4])
          index = open('dist/index.html', encoding='utf-8').read()
          # Positive control first: if the homepage lists no posts at all, the
          # absence of a draft below would prove nothing.
          published = [os.path.basename(f) for f in glob.glob('dist/blog/*/index.html')]
          if not published:
              print('::error::dist/blog is empty — the check below would be vacuous'); sys.exit(1)
          leaked = [d for d in drafts if d in index]
          if leaked:
              print(f'::error::draft posts reached the homepage: {leaked}'); sys.exit(1)
          print(f'ok: {len(drafts)} draft(s) held back, {len(published)} post(s) published')
          PY
